name: 사진(공식 게시물) 추가
description: 공식 X·인스타그램·위버스 게시물 주소를 붙여 넣으면 사진 페이지에 추가됩니다. 여러 개를 한 번에 넣을 수 있습니다.
title: "사진 추가"
body:
  - type: textarea
    id: urls
    attributes:
      label: 게시물 주소 (한 줄에 하나)
      description: |
        공식 계정 게시물만 됩니다: X @sa2m2nam3, @sa2m2nam3_JP / 인스타그램 @sa2m2nam3 / 위버스 세이마이네임.
        X 게시물은 날짜와 멤버(해시태그)를 자동으로 채웁니다.
      placeholder: |
        https://x.com/sa2m2nam3/status/...
        https://www.instagram.com/p/...
    validations:
      required: true
  - type: checkboxes
    id: members
    attributes:
      label: 나온 멤버 (인스타그램·위버스용, X는 자동)
      options:
        - label: 히토미
        - label: 슈이
        - label: 메이
        - label: 카니
        - label: 소하
        - label: 도희
        - label: 준휘
        - label: 승주
