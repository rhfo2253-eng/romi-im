name: GitHub Pages에 올리기

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 매시간 유튜브 채널을 확인해 새로 공개된 압축본을 반영하고 다시 올린다
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 유튜브 새 영상 확인
        run: node scripts/sync-youtube.mjs
      - name: 공식 유튜브 최신 영상 확인
        run: node scripts/sync-official.mjs
      - name: 바뀐 데이터 저장
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "유튜브 새 영상·공식 채널 반영"
            git push
          fi
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
